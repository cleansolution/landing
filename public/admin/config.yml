backend:
  name: git-gateway
  branch: main

# Para desarrollo local, descomentar esta línea:
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "pages"
    label: "Contenido del Sitio"
    files:
      - label: "Información de Contacto"
        name: "contact"
        file: "src/data/contact.json"
        fields:
          - {label: "Teléfono", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Dirección", name: "address", widget: "string"}
          - {label: "Ciudad", name: "city", widget: "string"}
          - {label: "Estado", name: "state", widget: "string"}
      
      - label: "Hero Section"
        name: "hero"
        file: "src/data/heroData.json"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            fields:
              - {label: "Texto Superior", name: "topText", widget: "string"}
              - {label: "Título Principal", name: "title", widget: "string"}
              - {label: "Subtítulo/Descripción", name: "subtitle", widget: "text"}
              - {label: "Texto del Botón", name: "buttonText", widget: "string", default: "Our Services"}
      
      - label: "Sobre Nosotros (About)"
        name: "about"
        file: "src/data/aboutData.json"
        fields:
          - {label: "Título Superior", name: "capText", widget: "string"}
          - {label: "Título Principal", name: "mainTitle", widget: "string"}
          - {label: "Descripción", name: "description", widget: "text"}
          - {label: "Años de Experiencia", name: "yearsExperience", widget: "number"}
      
      - label: "Servicios"
        name: "services"
        file: "src/data/servicesData.json"
        fields:
          - label: "Lista de Servicios"
            name: "services"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "text"}
              - {label: "Imagen", name: "img", widget: "string"}
              - {label: "Icono SVG", name: "svg", widget: "string"}
              - {label: "Enlace", name: "link", widget: "string", default: "/Services"}
      
      - label: "Proyectos"
        name: "projects"
        file: "src/data/projectData.json"
        fields:
          - label: "Lista de Proyectos"
            name: "projects"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Imagen", name: "image", widget: "string"}
              - {label: "Enlace", name: "link", widget: "string"}
      
      - label: "Equipo"
        name: "team"
        file: "src/data/teamData.json"
        fields:
          - label: "Miembros del Equipo"
            name: "team"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Cargo", name: "designation", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "text"}
              - {label: "Imagen", name: "img", widget: "string"}
      
      - label: "Testimonios"
        name: "testimonials"
        file: "src/data/testimonailData.json"
        fields:
          - label: "Lista de Testimonios"
            name: "testimonials"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Cargo", name: "designation", widget: "string"}
              - {label: "Testimonio", name: "text", widget: "text"}
              - {label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5}
              - {label: "Imagen", name: "img", widget: "string"}

  - name: "blog"
    label: "Blog"
    folder: "src/data/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string"}
      - {label: "Categoría", name: "category", widget: "string"}
      - {label: "Imagen", name: "image", widget: "string"}
      - {label: "Extracto", name: "excerpt", widget: "text"}
      - {label: "Contenido", name: "body", widget: "markdown"}
