backend:
  name: git-gateway
  branch: main

# Para desarrollo local, descomentar esta línea:
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "pages"
    label: "Contenido del Sitio"
    files:
      - label: "Información de Contacto"
        name: "contact"
        file: "src/data/contact.json"
        fields:
          - {label: "Teléfono", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Dirección", name: "address", widget: "string"}
          - {label: "Ciudad", name: "city", widget: "string"}
          - {label: "Estado", name: "state", widget: "string"}
      
      - label: "Hero Section (Slider Principal)"
        name: "hero"
        file: "src/data/heroData.json"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            fields:
              - {label: "Texto Superior", name: "topText", widget: "string"}
              - {label: "Título Principal", name: "title", widget: "string"}
              - {label: "Subtítulo/Descripción", name: "subtitle", widget: "text"}
              - {label: "Texto del Botón", name: "buttonText", widget: "string", default: "Our Services"}
      
      - label: "Sobre Nosotros (About)"
        name: "about"
        file: "src/data/aboutData.json"
        fields:
          - {label: "Título Superior", name: "capText", widget: "string"}
          - {label: "Título Principal", name: "mainTitle", widget: "string"}
          - {label: "Descripción", name: "description", widget: "text"}
          - {label: "Años de Experiencia", name: "yearsExperience", widget: "number"}
      
      - label: "Características/Features"
        name: "features"
        file: "src/data/featuresData.json"
        fields:
          - label: "Lista de Características"
            name: "features"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Icono", name: "icon", widget: "string"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
      
      - label: "Títulos de Secciones"
        name: "sections"
        file: "src/data/sectionsData.json"
        fields:
          - label: "Featured Services"
            name: "featuredServices"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
          - label: "Why Choose Us"
            name: "whyChooseUs"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - label: "Beneficios"
                name: "benefits"
                widget: "list"
                fields:
                  - {label: "ID", name: "id", widget: "number"}
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "Descripción", name: "description", widget: "text"}
          - label: "How It Works"
            name: "howItWorks"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - label: "Pasos"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "ID", name: "id", widget: "number"}
                  - {label: "Icono", name: "icon", widget: "string"}
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "Descripción", name: "description", widget: "text"}
          - label: "Our Works"
            name: "ourWorks"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
          - label: "Team Section"
            name: "teamSection"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
          - label: "Cost Calculator"
            name: "costCalculator"
            widget: "object"
            fields:
              - {label: "Título de Sección", name: "sectionTitle", widget: "string"}
              - {label: "Título Principal", name: "mainTitle", widget: "string"}
      
      - label: "Servicios"
        name: "services"
        file: "src/data/servicesData.json"
        fields:
          - label: "Lista de Servicios"
            name: "services"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "text"}
              - {label: "Imagen", name: "img", widget: "string", hint: "Nombre del archivo (ej: slider-img1.jpg)"}
              - {label: "Icono SVG", name: "svg", widget: "string", hint: "Nombre del archivo SVG"}
              - {label: "Enlace", name: "link", widget: "string", default: "/Services"}
      
      - label: "Proyectos"
        name: "projects"
        file: "src/data/projectData.json"
        fields:
          - label: "Lista de Proyectos"
            name: "projects"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Imagen", name: "image", widget: "string", hint: "Nombre del archivo"}
              - {label: "Enlace", name: "link", widget: "string"}
      
      - label: "Equipo"
        name: "team"
        file: "src/data/teamData.json"
        fields:
          - label: "Miembros del Equipo"
            name: "team"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Cargo", name: "designation", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "text"}
              - {label: "Imagen", name: "img", widget: "string", hint: "Nombre del archivo"}
      
      - label: "Testimonios"
        name: "testimonials"
        file: "src/data/testimonailData.json"
        fields:
          - label: "Lista de Testimonios"
            name: "testimonials"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Cargo", name: "designation", widget: "string"}
              - {label: "Testimonio", name: "text", widget: "text"}
              - {label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5}
              - {label: "Imagen", name: "img", widget: "string", hint: "Nombre del archivo"}
      
      - label: "Footer"
        name: "footer"
        file: "src/data/footerData.json"
        fields:
          - label: "Información de la Empresa"
            name: "companyInfo"
            widget: "object"
            fields:
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Dirección", name: "address", widget: "string"}
              - {label: "Teléfono", name: "phone", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
          - label: "Enlaces Rápidos"
            name: "quickLinks"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Texto", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - label: "Redes Sociales"
            name: "socialMedia"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Plataforma", name: "platform", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Icono", name: "icon", widget: "string"}
          - {label: "Copyright", name: "copyright", widget: "string"}
      
      - label: "Botones y CTAs"
        name: "cta"
        file: "src/data/ctaData.json"
        fields:
          - label: "Botones"
            name: "buttons"
            widget: "object"
            fields:
              - label: "Botón Principal"
                name: "primaryCTA"
                widget: "object"
                fields:
                  - {label: "Texto", name: "text", widget: "string"}
                  - {label: "Enlace", name: "link", widget: "string"}
              - label: "Botón Secundario"
                name: "secondaryCTA"
                widget: "object"
                fields:
                  - {label: "Texto", name: "text", widget: "string"}
                  - {label: "Enlace", name: "link", widget: "string"}
              - label: "Botón de Contacto"
                name: "contactCTA"
                widget: "object"
                fields:
                  - {label: "Texto", name: "text", widget: "string"}
                  - {label: "Enlace", name: "link", widget: "string"}
              - label: "Botón About"
                name: "aboutCTA"
                widget: "object"
                fields:
                  - {label: "Texto", name: "text", widget: "string"}
                  - {label: "Enlace", name: "link", widget: "string"}
          - label: "Llamadas a la Acción"
            name: "callToAction"
            widget: "object"
            fields:
              - {label: "Texto 'Need Help'", name: "needHelp", widget: "string"}
              - {label: "Etiqueta de Teléfono", name: "phoneLabel", widget: "string"}
      
      - label: "SEO Meta Tags"
        name: "seo"
        file: "src/data/seoData.json"
        fields:
          - label: "Página Principal"
            name: "home"
            widget: "object"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Palabras Clave", name: "keywords", widget: "string"}
          - label: "Página About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Palabras Clave", name: "keywords", widget: "string"}
          - label: "Página Services"
            name: "services"
            widget: "object"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Palabras Clave", name: "keywords", widget: "string"}
          - label: "Página Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Palabras Clave", name: "keywords", widget: "string"}

  - name: "blog"
    label: "Blog"
    folder: "src/data/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string"}
      - {label: "Categoría", name: "category", widget: "string"}
      - {label: "Imagen", name: "image", widget: "string"}
      - {label: "Extracto", name: "excerpt", widget: "text"}
      - {label: "Contenido", name: "body", widget: "markdown"}
